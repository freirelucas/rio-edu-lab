[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rioedu"
version = "0.1.0"
description = "Wizard CLI + notebook generator for rio-edu-lab — template-curated paper replications on data.rio"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Lucas Freire"}]
license = {text = "MIT"}
dependencies = [
    "typer>=0.12",
    "nbformat>=5.10",
    "pyyaml>=6.0",
]

[project.scripts]
rioedu = "rioedu.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rioedu"]
