[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pragmatic defaults — catch real issues, don't be pedantic about style.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # isort
    "B",   # flake8-bugbear (likely bugs)
    "UP",  # pyupgrade (modern syntax)
]
# Don't bikeshed line length — analytical scripts have wide tables.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests can use long lines and aren't expected to be perfectly typed.
"tests/*" = ["E501"]
