name: Refresh manifest

on:
  schedule:
    # Todo dia 1 do mês às 06:00 UTC
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install package
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e .

      - name: Refresh manifest
        run: |
          source .venv/bin/activate
          acec manifest refresh
          acec manifest stats

      - name: Create Pull Request if changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(manifest): refresh periódico do data.rio"
          title: "chore(manifest): refresh periódico do data.rio"
          body: |
            Atualização automática do `manifest.json` a partir da API do data.rio.

            Verificar:
            - [ ] Total de itens (deve estar em torno de 186)
            - [ ] Novos itens publicados pelo IPP
            - [ ] Itens removidos ou modificados
          branch: chore/manifest-refresh
          delete-branch: true
          add-paths: manifest.json
