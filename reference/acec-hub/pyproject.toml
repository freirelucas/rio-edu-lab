[project]
name = "acec"
version = "0.1.0"
description = "Atlas Cibernético da Educação Carioca — operacionalização de papers acadêmicos sobre o data.rio Educação"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Lucas Freire" }
]
requires-python = ">=3.11"
keywords = ["open-data", "education", "rio-de-janeiro", "h3", "inequality"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    # Core
    "pandas>=2.2",
    "polars>=1.0",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "duckdb>=1.0",
    # HTTP
    "httpx>=0.27",
    "requests>=2.32",
    # Geo
    "geopandas>=1.0",
    "shapely>=2.0",
    "h3>=4.1",
    "pyproj>=3.6",
    # Excel
    "openpyxl>=3.1",
    "xlrd>=2.0",
    # CLI
    "typer>=0.12",
    "rich>=13.7",
    # Logging
    "structlog>=24.1",
]

[project.optional-dependencies]
viz = [
    "streamlit>=1.36",
    "folium>=0.17",
    "plotly>=5.22",
    "matplotlib>=3.9",
    "altair>=5.3",
]
notebooks = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "nbstripout>=0.7",
]
all = ["acec[viz,notebooks,dev]"]

[project.urls]
Homepage = "https://github.com/freirelucas/acec-hub"
Repository = "https://github.com/freirelucas/acec-hub"
Issues = "https://github.com/freirelucas/acec-hub/issues"

[project.scripts]
acec = "acec.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acec"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF", # ruff-specific
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests", "products"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
