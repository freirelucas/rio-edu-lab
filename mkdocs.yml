site_name: rio-edu-lab
site_description: Laboratório exploratório sobre o Grupo Educação do data.rio.
site_url: https://freirelucas.github.io/rio-edu-lab/
repo_url: https://github.com/freirelucas/rio-edu-lab
repo_name: freirelucas/rio-edu-lab
edit_uri: edit/main/docs/

theme:
  name: material
  language: pt-BR
  logo: _assets/logo.svg
  favicon: _assets/logo.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - navigation.footer
    - header.autohide
    - content.code.copy
    - content.action.edit
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Modo claro
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.plot.ly/plotly-2.35.0.min.js
  - javascripts/charts.js

nav:
  - Início: index.md
  - API do data.rio: data-rio-api.md
  - Relatórios:
      - 01 — EDA do manifest: reports/01_manifest_eda.md
      - 02 — Probe de ingestão: reports/02_ingestion_probe.md
      - 03 — Catálogo empírico dos Excels: reports/03_excel_catalog.md
      - 04 — Auditoria do shortlist: reports/04_shortlist_audit.md
      - 05 — Corpus dos PDFs: reports/05_pdf_corpus.md
      - 06 — Theil sobre IDEB por bairro: reports/06_theil_ideb.md
      - 06b — Theil ponderado por matrícula: reports/06b_theil_weighted.md
      - 07 — HEX-EDU estático: reports/07_hex_edu_static.md
      - 08 — HEX-EDU interativo: reports/08_hex_edu_interactive.md
      - 09 — IDEB séries finais (9º): reports/09_anos_finais.md
      - 10 — Replicação metodológica: reports/10_method_replication.md
      - 11 — THESHA-Rio (3-level Theil): reports/11_thesha_rio.md
      - 12 — FUN-Rio (pseudocoortes 5º→9º): reports/12_fun_rio.md
      - 13 — PM-12 (lei de escala intra-Rio): reports/13_pm_12.md
  - Paper:
      - HEX-EDU manuscript (v0.1 draft): paper/hex_edu_manuscript.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/freirelucas/rio-edu-lab

copyright: |
  &copy; 2026 — Código MIT, dados derivados CC BY 4.0.
  Dados brutos: <a href="https://www.data.rio">data.rio</a> / IPP.
