site_name: rio-edu-lab
site_description: Papers de educação cruzados com os 9.855 datasets públicos do data.rio. Status de replicação, código aberto, DOI Zenodo. Reproduzível em 4 minutos.
site_url: https://freirelucas.github.io/rio-edu-lab/
repo_url: https://github.com/freirelucas/rio-edu-lab
repo_name: freirelucas/rio-edu-lab
edit_uri: edit/main/docs/

theme:
  name: material
  language: pt-BR
  logo: _assets/logo.svg
  favicon: _assets/logo.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - navigation.footer
    - header.autohide
    - content.code.copy
    - content.action.edit
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Modo claro
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.plot.ly/plotly-2.35.0.min.js
  - javascripts/charts.js

validation:
  nav:
    omitted_files: ignore     # papers/* + reports/* são linkados via index páginas
    not_found: warn

nav:
  - Início: index.md
  - Achados:
      - Visão geral: achados.md
      - HEX-EDU (Theil + Pereira): produtos/hex_edu.md
      - VULN-EDU (Reardon): produtos/vuln_edu.md
      - Bairros prioritários: bairros-prioritarios.md
      - Mapa interativo: mapa.md
  - Papers: papers/index.md
  - Dados:
      - Visão geral: dados.md
      - API técnica do data.rio: data-rio-api.md
      - Papers por item do data.rio: papers-by-data-rio.md
  - Sobre:
      - Visão geral: sobre.md
      - Arquitetura (VSM + roadmap v0.16): arquitetura.md
      - Histórico técnico: investigacao.md
      - Reproduzir: reproduzir.md
      - Qualidade do pipeline: qualidade.md
      - Qualidade do match: match-quality.md
      - TOP Guidelines scorecard: top-scorecard.md
      - Provenance trail (audit chains):
          - Theil 1967: provenance/theil-1967-economics.md
          - Pereira 2019 IPEA: provenance/pereira-2019-ipea.md
          - Reardon 2011 Whither: provenance/reardon-2011-whither.md
      - LLM vs IDF: llm-vs-bow.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/freirelucas/rio-edu-lab

copyright: |
  &copy; 2026 — Código MIT, dados derivados CC BY 4.0.
  Dados brutos: <a href="https://www.data.rio">data.rio</a> / IPP.
