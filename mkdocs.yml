site_name: rio-edu-lab
site_description: Laboratório de replicação de papers em educação aplicados ao Rio — catálogo cruzado com o data.rio.
site_url: https://freirelucas.github.io/rio-edu-lab/
repo_url: https://github.com/freirelucas/rio-edu-lab
repo_name: freirelucas/rio-edu-lab
edit_uri: edit/main/docs/

theme:
  name: material
  language: pt-BR
  logo: _assets/logo.svg
  favicon: _assets/logo.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - navigation.footer
    - header.autohide
    - content.code.copy
    - content.action.edit
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Modo claro
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.plot.ly/plotly-2.35.0.min.js
  - javascripts/charts.js

nav:
  - Início: index.md
  - Tour: tour.md
  - Mapa: mapa.md
  - Papers:
      - Catálogo: papers/index.md
      - "Pereira et al. (2019) — H3 acessibilidade": papers/pereira-2019-ipea.md
      - "Reardon (2011) — SES × desempenho": papers/reardon-2011-whither.md
      - "Theil (1967) — entropia": papers/theil-1967-economics.md
      - "Soares & Andrade (2006) — NSE × IDEB BH": papers/soares-andrade-2006.md
      - "Alves & Soares (2013) — contexto escolar": papers/alves-soares-2013.md
      - "Coleman et al. (1966) — EEO": papers/coleman-1966-eeo.md
      - "Hanushek (1986) — função-produção": papers/hanushek-1986-jel.md
      - "Reardon & Owens (2014) — segregação SES": papers/reardon-owens-2014.md
      - "Becker (1964) — capital humano": papers/becker-1964-human-capital.md
      - "Cunha & Heckman (2007) — formação de habilidades": papers/cunha-heckman-2007.md
      - "Hoxby (2000) — school choice": papers/hoxby-2000-aer.md
      - "Card & Krueger (1992) — school quality": papers/card-krueger-1992-jpe.md
  - Produtos:
      - Visão geral: produtos/index.md
      - HEX-EDU: produtos/hex_edu.md
      - VULN-EDU: produtos/vuln_edu.md
  - Bairros prioritários: bairros-prioritarios.md
  - Investigação:
      - Visão geral: investigacao.md
      - Inventário do acervo:
          - 01 — Manifest: reports/01_manifest_eda.md
          - 02 — API probe: reports/02_ingestion_probe.md
          - 03 — Catálogo Excels: reports/03_excel_catalog.md
          - 04 — Shortlist: reports/04_shortlist_audit.md
          - 05 — Corpus PDFs: reports/05_pdf_corpus.md
      - HEX-EDU profundo:
          - 06 — Theil base: reports/06_theil_ideb.md
          - 06b — Theil ponderado: reports/06b_theil_weighted.md
          - 07 — Mapa estático: reports/07_hex_edu_static.md
          - 08 — Mapa interativo (técnico): reports/08_hex_edu_interactive.md
          - 09 — ANOS_FINAIS: reports/09_anos_finais.md
          - 10 — Replicação metodológica: reports/10_method_replication.md
      - Outros produtos:
          - 11 — THESHA-Rio: reports/11_thesha_rio.md
          - 12 — FUN-Rio: reports/12_fun_rio.md
          - 13 — PM-12: reports/13_pm_12.md
      - HEX-EDU acessibilidade:
          - 14 — Acessibilidade Pereira-style: reports/14_acessibilidade.md
      - VULN-EDU:
          - 15 — IDS × IDEB por bairro: reports/15_vuln_edu.md
  - Recursos:
      - API do data.rio: data-rio-api.md
      - Glossário: glossario.md
      - Reproduzir: reproduzir.md
      - Editar deposit Zenodo: zenodo-deposit.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/freirelucas/rio-edu-lab

copyright: |
  &copy; 2026 — Código MIT, dados derivados CC BY 4.0.
  Dados brutos: <a href="https://www.data.rio">data.rio</a> / IPP.
