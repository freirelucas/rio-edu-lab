name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev + lab + acec deps
        # The Theil tests are pure stdlib + pytest; the data-sanity tests
        # only read committed CSVs. We install requirements.txt so that
        # any future tests that touch the geo/h3 stack still work.
        # Also install the acec package in editable mode so its tests run
        # against the canonical source (session 11 bridge).
        run: |
          pip install -r requirements-dev.txt
          pip install -r requirements.txt
          pip install -e reference/acec-hub

      - name: Lint with ruff
        run: ruff check analysis/ tests/
        continue-on-error: true  # warn-only for now; tighten in v0.2.

      - name: Run lab tests
        run: pytest -v tests/

      - name: Run acec package tests
        run: pytest -v reference/acec-hub/tests/test_acec_stats.py

      - name: Validate paper catalog schema
        # Hard checks (id, year, replication_status, report_ids invariant)
        # + soft warnings for data_requirements outside taxonomy.
        # Soft mode default — taxonomy warnings don't fail CI yet.
        run: python3 analysis/31_build_paper_catalog.py

      - name: Verify paper mini-pages in sync with catalog
        # Re-renders docs/papers/*.md and fails if the generated content
        # diverges from what's committed. Forces contributors to run
        # `python3 analysis/32_render_papers_pages.py` before pushing
        # any change to data/papers_catalog.yml.
        run: |
          python3 analysis/32_render_papers_pages.py
          if ! git diff --quiet docs/papers/; then
            echo "::error::docs/papers/ out of sync with data/papers_catalog.yml"
            echo "::error::run: python3 analysis/32_render_papers_pages.py && git add docs/papers/"
            git --no-pager diff docs/papers/
            exit 1
          fi

      - name: Verify papers-by-data-rio reverse link in sync
        # Re-renders docs/papers-by-data-rio.md (link reverso item × papers)
        # and fails if drift vs committed. Same rationale as mini-pages.
        run: |
          python3 analysis/41_match_requirements.py
          if ! git diff --quiet docs/papers-by-data-rio.md; then
            echo "::error::docs/papers-by-data-rio.md out of sync"
            echo "::error::run: python3 analysis/41_match_requirements.py && git add docs/"
            git --no-pager diff docs/papers-by-data-rio.md
            exit 1
          fi

      - name: Validate paper funnel schema
        # Schema check for data/papers_funnel.yml (Stage 1-3 staging area).
        # Catches corrupted YAML, invalid decision values, or category_ids
        # pointing outside requirements_taxonomy.yml. Funnel is curator-edited;
        # CI just guards the shape so 48_promote_funnel.py never breaks.
        run: python3 analysis/31_build_paper_catalog.py --validate-funnel

      - name: Verify funnel state + landing numbers in sync
        # Re-runs 25_funnel_state.py (charts + funnel_state.json + the
        # data-driven big-nums injected into docs/index.md) and fails on drift.
        # Funil analítico: the landing numbers are derived from the funnel, not
        # hand-edited — this guards against stale absolute numbers.
        run: |
          python3 analysis/25_funnel_state.py
          if ! git diff --quiet docs/index.md docs/_assets/charts/funnel.json docs/_assets/charts/data_rio_coverage.json docs/_assets/charts/themes.json data/processed/funnel_state.json; then
            echo "::error::funnel state out of sync — run: python3 analysis/25_funnel_state.py && git add docs/ data/processed/funnel_state.json"
            git --no-pager diff docs/index.md docs/_assets/charts/ data/processed/funnel_state.json
            exit 1
          fi

      - name: Verify match-quality report in sync
        # Re-runs 51_match_quality_report.py over data/match_quality_gold.yml
        # (the curator-labeled sample) and fails if drift vs committed
        # docs/match-quality.md or data/processed/match_quality_summary.json.
        # Guards against forgetting to re-render after labeling new pairs.
        run: |
          python3 analysis/51_match_quality_report.py
          if ! git diff --quiet docs/match-quality.md data/processed/match_quality_summary.json; then
            echo "::error::match-quality report out of sync after labeling"
            echo "::error::run: python3 analysis/51_match_quality_report.py && git add docs/match-quality.md data/processed/match_quality_summary.json"
            git --no-pager diff docs/match-quality.md data/processed/match_quality_summary.json
            exit 1
          fi

      - name: Verify llm-vs-bow comparison in sync
        # Re-runs 56_llm_vs_bow_compare.py over funnel + gold-set.
        # Guarda que report fica sincronizado após populates de llm_* via 55
        # (que é manual + opt-in; CI não chama API). Sem llm_* nos candidates,
        # report renderiza um "nothing yet" admonition — drift-stable.
        run: |
          python3 analysis/56_llm_vs_bow_compare.py
          if ! git diff --quiet docs/llm-vs-bow.md data/processed/llm_vs_bow_comparison.json; then
            echo "::error::llm-vs-bow report out of sync after populating llm_* signals"
            echo "::error::run: python3 analysis/56_llm_vs_bow_compare.py && git add docs/llm-vs-bow.md data/processed/llm_vs_bow_comparison.json"
            git --no-pager diff docs/llm-vs-bow.md data/processed/llm_vs_bow_comparison.json
            exit 1
          fi

      - name: Verify theil bootstrap CI in sync
        # Re-runs 35_bootstrap_theil_ci.py (seed=42 fixo + year offset → determinístico)
        # e diffa data/processed/theil_bootstrap_ci.csv. Guarda contra drift se
        # alguém mexer no script ou na primitiva acec.stats.theil_decompose.
        run: |
          python3 analysis/35_bootstrap_theil_ci.py
          if ! git diff --quiet data/processed/theil_bootstrap_ci.csv; then
            echo "::error::theil_bootstrap_ci.csv out of sync"
            echo "::error::run: python3 analysis/35_bootstrap_theil_ci.py && git add data/processed/theil_bootstrap_ci.csv"
            git --no-pager diff data/processed/theil_bootstrap_ci.csv
            exit 1
          fi

      - name: Verify TOP scorecard in sync
        # Re-runs 60_top_scorecard.py over papers_catalog.yml.
        # Guarda contra drift se schema YAML estendido (DAS/provenance) mudar.
        # Saída pura-determinística (sem cache, sem network).
        run: |
          python3 analysis/60_top_scorecard.py
          if ! git diff --quiet docs/top-scorecard.md data/processed/top_scorecard.csv data/processed/top_scorecard.md data/processed/top_summary.json; then
            echo "::error::TOP scorecard out of sync"
            echo "::error::run: python3 analysis/60_top_scorecard.py && git add docs/top-scorecard.md data/processed/top_*"
            git --no-pager diff docs/top-scorecard.md data/processed/top_scorecard.csv
            exit 1
          fi
