name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-docs.txt

      - run: mkdocs build --strict

      # Replace upload-pages-artifact@v3 with upload-artifact@v4 (overwrite: true)
      # so Re-run All Jobs is idempotent — v3 has no overwrite option, which
      # causes "Multiple artifacts named github-pages" on re-runs.
      - name: Tar site for Pages
        run: |
          tar \
            --dereference --hard-dereference \
            --directory site \
            --exclude=.git --exclude=.github \
            -cvf "$RUNNER_TEMP/artifact.tar" .

      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          overwrite: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
