<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="rio-edu-lab logo">
  <title>rio-edu-lab</title>
  <!-- Hexágono externo (representa AP/RA - escala administrativa) -->
