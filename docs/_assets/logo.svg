           fill="none" stroke="#008572" stroke-width="3" stroke-linejoin="round"/>
  <!-- Hexágono médio (representa bairro) -->
  <polygon points="50,26 72,38 72,62 50,74 28,62 28,38"
           fill="none" stroke="#008572" stroke-width="2.4" stroke-linejoin="round" opacity="0.75"/>
  <!-- Hexágono interno (representa hex H3) -->
  <polygon points="50,40 60,46 60,58 50,64 40,58 40,46"
           fill="#008572" stroke="#008572" stroke-width="1.6" stroke-linejoin="round" opacity="0.85"/>
</svg>
