# code_signals.yml — Sprint v0.15 Stream 2 (alt) "in-session" GitHub search
#
# Per-candidate code_signal derivados de mcp__github__search_code (claude_session,
# sem GITHUB_TOKEN). Querying schema: DOI literal entre aspas + filter por
# extensão de código (.py/.R/.ipynb) pra eliminar bib-ref noise.
#
# Persistido aqui pra dois usos:
#   1. Audit trail committed (vs. cache .gitignored): toda busca tem timestamp +
#      _source pra reprodutibilidade
#   2. Idempotent apply via analysis/45c_apply_code_signals.py → popula
#      candidates[].code_signal no funnel YAML
#
# Pattern descoberto (top 16 fully-covered + 1 BR fully-covered, todos pré-2010):
# **zero code hits por DOI literal**. Papers educacionais clássicos (Coleman 1966,
# Oakes 1985, Bowles-Gintis 1976, Hanushek, Hoxby, Reardon-Owens 2014) não têm
# replicações Python/R/Jupyter publicadas com referência ao DOI. Bib citations
# em refs.bib são abundantes (~10-30 hits cada) mas filtramos com extension.
#
# Sinal real fica na busca por method-name (não por DOI) — documentado em
# docs/dados.md "Comunidade no GitHub". Aqui só per-candidate.

version: 1
searched_at: "2026-06-08"
description: >-
  GitHub code search results per candidate (DOI literal + extension filter
  pra .py/.R/.ipynb). Zero hits é finding honesto — papers educacionais
  clássicos pré-2010 não têm replications públicas DOI-linkadas. Re-rodar
  com --refresh quando novos candidates ricos entrarem.

