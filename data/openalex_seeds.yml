# Núcleo bibliométrico do funil de papers (Stage 1).
# ---------------------------------------------------
# Cada seed é um paper canônico que ancora a descoberta. O `45_bulk_discover.py`
# faz snowball a partir desta lista:
#
#   - backward (mainstream): pega `referenced_works` do seed via OpenAlex →
#     papers que o seed cita herdam a curadoria do seed.
#   - forward (outsider): pega papers que citam o seed (filtro lateral
#     20 ≤ cited_by_count ≤ 500) → diversidade controlada, foco em
#     papers com sinal de replicabilidade (github/osf/dataverse).
#
# Schema por seed:
#   openalex_id    obrigatório, formato W… (sem prefixo https://)
#   label          humano, usado em logs e em discovered_via
#   track          mainstream | outsider
#                    mainstream → backward + forward
#                    outsider   → forward only (sem snowball backward)
#   top_forward    (opcional) cap de papers no forward; default 50
#   enabled        (opcional) bool; default true
#
# Convenção: minimo 15 seeds, máximo ~30 (custo OpenAlex é 1 req/s).
# Curador adiciona/remove em PR para este arquivo. IDs descobertos em
# https://openalex.org (busca por título → copiar do URL).

