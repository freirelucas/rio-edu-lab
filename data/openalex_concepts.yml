# Conceitos / queries OpenAlex para a descoberta em lote
# -------------------------------------------------------
# Cada `theme` representa uma faceta temática do catálogo do lab. Pode usar
# uma `query` em texto livre (semântica do OpenAlex) e/ou um `concept_id`
# canônico (estável entre releases do OpenAlex).
#
# Schema por theme:
#   id              kebab-case, único, estável (vira tag em discovered_via)
#   label_pt        nome humano (usado em relatórios e CSVs derivados)
#   query           (opcional) texto livre para search=
#   concept_id      (opcional) ID de concept OpenAlex (e.g., C71924100)
#   year_from       (opcional) ano mínimo de publicação
#   year_to         (opcional) ano máximo de publicação
#   min_citations   (default 200) corte de impacto — quanto mais geral o
#                   conceito, mais alto deve ser
#   top             (default 30) papers a coletar por theme
#   enabled         (default true) desabilitar sem deletar
#
# Convenção: query OU concept_id. Se ambos passados, OpenAlex combina como AND.
# Adicionar tema = PR para este arquivo. Curador calibra `min_citations` e `top`
# para balancear sinal vs ruído por tema.
#
# Resultado: `analysis/45_bulk_discover.py` itera estes themes, deduplica por
# openalex_id e popula `data/papers_funnel.yml`. Recomendação: começar com 4-6
# themes, expandir conforme o catálogo cresce.

version: 1

themes:

  - id: educational-inequality
    label_pt: "Desigualdade educacional"
    query: "educational inequality"
    year_from: 1990
    min_citations: 300
    top: 30

  - id: school-segregation
    label_pt: "Segregação escolar"
    query: "school segregation"
    year_from: 1980
    min_citations: 200
    top: 25

  - id: economics-of-education
    label_pt: "Economia da educação"
    query: "economics of education"
    year_from: 1980
    min_citations: 300
    top: 30

  - id: school-effects
    label_pt: "Efeito-escola / value-added"
    query: "school effects student achievement"
    year_from: 1980
    min_citations: 200
    top: 25

  - id: early-childhood-education
    label_pt: "Educação na primeira infância"
    query: "early childhood education outcomes"
    year_from: 1990
    min_citations: 200
    top: 25

  - id: educational-accessibility
    label_pt: "Acessibilidade educacional"
    query: "school accessibility spatial inequality"
    year_from: 2000
    min_citations: 100
    top: 25

  - id: education-brazil
    label_pt: "Educação — Brasil"
    query: "Brazil education achievement"
    year_from: 1990
    min_citations: 50
    top: 30

  - id: human-capital-returns
    label_pt: "Capital humano / retornos"
    query: "human capital returns to schooling"
    year_from: 1980
    min_citations: 500
    top: 20
