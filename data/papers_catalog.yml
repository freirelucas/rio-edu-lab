# rio-edu-lab — catálogo de papers
# ----------------------------------
# Esta é a fonte canônica do catálogo de papers replicados/catalogados pelo lab.
# Cada entrada descreve o paper + os requisitos de dados + o status de replicação
# + o cruzamento com itens disponíveis no data.rio.
#
# Schema (campos por entrada):
#   id                              slug autor-ano-fonte (único, kebab-case)
#   authors                         lista de sobrenomes
#   year                            ano de publicação (inteiro)
#   title                           título do paper
#   venue                           nome do journal / livro / IPEA TD / etc.
#   doi_or_url                      DOI canônico ou URL estável
#   pdf_url                         (opcional) link direto para PDF aberto
#   openalex_id                     (opcional) preenchido por analysis/34_fetch_openalex.py
#   citations_openalex              (opcional) snapshot da contagem; idem
#   citations_openalex_fetched_at   (opcional) data ISO do snapshot
#   abstract                        resumo em pt-BR (1-3 frases)
#   area                            tags temáticas (lista)
#   method                          tags metodológicas (lista)
#   brazil_specific                 true se o paper trata especificamente do Brasil
#   data_requirements               lista de dados necessários para replicar
#   data_rio_coverage               cruzamento com manifest data.rio (lista de dicts)
#     - requirement: "..."          (string)
#       item_id: "..."              (id do data.rio ou null)
#       status: available | partial | external | missing
#   replication_status              full | partial | pending | unfeasible
#   product                         (opcional) sigla do produto associado, ex. "HEX-EDU"
#   report_ids                      (opcional) lista de IDs de relatórios docs/reports/NN_*.md
#   scripts                         (opcional) lista de IDs de scripts analysis/NN_*.py
#   policy_insight                  (opcional) 1 frase para gestores públicos
#   applied_finding_question        (opcional, full/partial) pergunta visitor-side que o paper responde
#   applied_finding_headline        (opcional, full/partial) resposta em 1 frase
#   applied_finding_lede            (opcional, full/partial) 1-3 frases de contexto/números
#
# Convenções de curadoria:
#   - A v0.7 entrega o framework + 12 papers seed (3 já replicados + 5 alvo de
#     novas replicações leves + 4 metodológicos). Os outros ~88 papers entram
#     em PRs subsequentes, em batches temáticos.
#   - Citações são snapshots do OpenAlex (script 34). Não refletem o ranking em
#     tempo real — recurar é trivial (rerodar o script).
#   - "Brasil-específico" inclui replicações em contexto brasileiro (Soares,
#     Alves, Albernaz, Riani) e exclui referências teóricas globais aplicáveis.

papers:

