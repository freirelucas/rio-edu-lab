  - id: pereira-2019-ipea
    authors: [Pereira, Braga, Serra, Nadalin]
    year: 2019
    title: "Desigualdades socioespaciais de acesso a oportunidades nas cidades brasileiras — 2019"
    venue: "IPEA Texto para Discussão 2535"
    doi_or_url: "https://hdl.handle.net/10419/240730"
    pdf_url: "https://repositorio.ipea.gov.br/bitstream/11058/9756/1/td_2535.pdf"
    abstract: >
      Discretiza o território urbano em hexágonos H3 e calcula acessibilidade
      a oportunidades (educação, saúde, emprego) ponderada por proximidade
      temporal via isócronas OSM e pela qualidade da oportunidade. Decompõe
      por renda e raça em 7 capitais brasileiras.
    area: ["acessibilidade", "equidade espacial", "geografia urbana"]
    method: ["H3 grid", "acessibilidade ponderada", "decomposição por SES"]
    brazil_specific: true
    data_requirements:
      - "geometria de escolas"
      - "indicador de qualidade educacional"
      - "rede viária / tempos de viagem"
      - "geometria de bairros"
    data_rio_coverage:
      - requirement: "geometria de escolas"
        item_id: "0a220ea7972d4adf85b3e63d23a4b9b1"
        status: available
      - requirement: "indicador de qualidade educacional"
        item_id: "ideb-municipal-bairros"
        status: available
      - requirement: "rede viária / tempos de viagem"
        item_id: null
        status: external
      - requirement: "geometria de bairros"
        item_id: "bairros-ipp"
        status: available
    replication_status: partial
    product: "HEX-EDU"
    report_ids: [14]
    scripts: [25, 26, 27]
    policy_insight: >
      AP 3 (Zona Norte) lidera acesso ponderado por IDEB; Zona Sul tem IDEB
      médio mais alto mas baixa densidade. Coropléticos por AP escondem
      variância intra-AP.
    applied_finding_question: "Qual zona do Rio tem mais acesso a boas escolas?"
    applied_finding_headline: "AP 3 (Zona Norte) lidera — não a Zona Sul."
    applied_finding_lede: >
      Acesso ponderado por IDEB: AP 3 com 113, AP 4 (Jacarepaguá/Barra) com 29.
      A Zona Sul tem escolas excelentes, mas espalhadas e poucas — por isso o
      acesso ponderado fica abaixo.

  - id: reardon-2011-whither
    authors: [Reardon]
    year: 2011
    title: "The widening academic-achievement gap between the rich and the poor: New evidence and possible explanations"
    venue: "Whither Opportunity? (Duncan & Murnane eds.), Russell Sage Foundation, ch. 5"
    doi_or_url: "https://cepa.stanford.edu/sites/default/files/reardon%20whither%20opportunity%20-%20chapter%205.pdf"
    pdf_url: "https://cepa.stanford.edu/sites/default/files/reardon%20whither%20opportunity%20-%20chapter%205.pdf"
    abstract: >
      Documenta que o gap de desempenho entre o quintil mais rico e o mais
      pobre nos EUA cresceu ~40% desde os anos 1970 e excede o gap racial
      branco-negro. Método: ordenar por SES, ordenar por desempenho,
      decompor o gap por percentil.
    area: ["desigualdade", "SES e desempenho", "tendências longitudinais"]
    method: ["gap por percentil", "decomposição de variância"]
    brazil_specific: false
    data_requirements:
      - "indicador socioeconômico granular"
      - "indicador de desempenho educacional"
    data_rio_coverage:
      - requirement: "indicador socioeconômico granular"
        item_id: "ids-rm-2010"
        status: available
      - requirement: "indicador de desempenho educacional"
        item_id: "ideb-municipal-bairros"
        status: available
    replication_status: partial
    product: "VULN-EDU"
    report_ids: [15]
    scripts: [28, 29, 30]
    policy_insight: >
      Gradiente SES × IDEB no Rio existe mas é modesto (R²=0.16); 39% dos
      bairros estão em quadrantes não-concordantes (resilientes ou
      sub-performance) — desfaz a leitura "Zona Sul = privilégio uniforme".
    applied_finding_question: "Riqueza prediz boa escola no Rio?"
    applied_finding_headline: "Parcialmente. R²=0,16; 39% dos bairros desafiam o gradiente."
    applied_finding_lede: >
      O gradiente SES → IDEB existe (Pearson +0,40) mas é modesto. 22% dos
      bairros são resilientes (baixo SES, bom IDEB) e 17% sub-performam (bom
      SES, baixo IDEB) — quase metade desafia a leitura "Zona Sul = privilégio
      uniforme".

  - id: theil-1967-economics
    authors: [Theil]
    year: 1967
    title: "Economics and Information Theory"
    venue: "North-Holland Publishing"
    doi_or_url: "https://www.worldcat.org/title/economics-and-information-theory/oclc/489908"
    abstract: >
      Introduz o índice T da entropia (GE(1)) e a decomposição aditiva
      between/within. Base metodológica para todas as análises de desigualdade
      decomponível do lab.
