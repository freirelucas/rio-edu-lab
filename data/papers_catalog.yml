      - "agrupamento hierárquico"
    data_rio_coverage:
      - requirement: "valores positivos por unidade"
        item_id: "ideb-municipal-bairros"
        status: available
      - requirement: "agrupamento hierárquico"
        item_id: "bairros-ipp"
        status: available
    replication_status: full
    product: "HEX-EDU"
    report_ids: [6, 7, 9, 11]
    scripts: [10, 16, 17, 18]
    policy_insight: >
      Decomposição Theil revela que 66% da desigualdade do IDEB municipal
      carioca está dentro das RAs, não entre — coropléticos por RA escondem
      a maior parte do sinal.
    applied_finding_question: "Onde está a desigualdade educacional no Rio?"
    applied_finding_headline: "Dentro dos bairros — não entre regiões."
    applied_finding_lede: >
      66% da variância do IDEB municipal carioca está dentro das Regiões
      Administrativas, não entre. Robusto em 6 séries × 9 anos (5º/9º ano,
      ponderado por matrícula, Aprovação/SAEB/IDEB). Nenhuma série cruza
      a paridade 50%.

